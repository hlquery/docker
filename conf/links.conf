# Minimal links.conf example for Docker
#
# This file is read INSIDE the container from:
#   /etc/hlquery/conf/links.conf
#
# It should list REMOTE peers only (no "self" entry).
#
# IMPORTANT:
# - role= must be a SINGLE value:
#     distributed (aliases: search, master)
#     slave       (alias: replica)
# - If one endpoint must serve both purposes, add TWO <node ...> entries.
#
# Example:
# <node host="10.0.0.10" port="9200" role="distributed" token="your_token">
# <node host="10.0.0.10" port="9200" role="slave" token="your_token">

