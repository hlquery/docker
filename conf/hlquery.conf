# Minimal hlquery.conf example for Docker
#
# This file is read INSIDE the container from:
#   /etc/hlquery/conf/hlquery.conf
#
# When using Docker Compose, you typically mount a host directory over that
# path, for example:
#   volumes:
#     - ./conf:/etc/hlquery/conf:ro
#
# Notes:
# - At least one <bind ...> is required.
# - HLQUERY_PORT env var does not rewrite this file; set the port here if you
#   want a non-9200 listener inside the container.

# Development-friendly logging to container stdout
<log method="console" type="*" level="normal">

# Listen on all interfaces in the container
<bind address="0.0.0.0" port="9200" type="http">

# Optional: include distributed/replication link endpoints
<include file="links.conf">

# Optional: disable auth for local testing
<auth enabled="false">

