# Production-oriented Docker configuration.
#
# Required environment variables:
#   HLQUERY_PRODUCTION=1
#   HLQUERY_ADMIN_TOKEN or HLQUERY_ADMIN_TOKEN_FILE
#   HLQUERY_USERS_ENCRYPTION_KEY or HLQUERY_USERS_ENCRYPTION_KEY_FILE

<log method="console" type="*" level="normal">

# Container traffic may arrive on any interface. Authentication is mandatory;
# use a firewall, private network, or reverse proxy to narrow exposure further.
<bind address="0.0.0.0" port="9200" type="http">
<host allow="*">

<include file="links.conf">

# Startup fails when this is enabled and neither a configured user nor an
# environment/file-provisioned administrator token is available.
<auth enabled="true">
